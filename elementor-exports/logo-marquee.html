<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Logo Marquee — Andes Safety</title>
</head>
<body style="margin:0;background:#fff;">

<style>
.as-logo-marquee{
  width:100vw !important;
  max-width:none !important;
  margin-left:calc(50% - 50vw) !important;
  height:120px !important;
  min-height:120px !important;
  transform:none !important;
  background:#fff !important;
  overflow:hidden !important;
  display:flex !important;
  align-items:center !important;
}
.as-logo-track{
  width:100%;
  max-width:1300px;
  margin:0 auto;
  height:100%;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:34px;
}
.as-logo-row{
  display:flex;
  width:max-content;
  animation:asLogoMove 28s linear infinite;
  will-change:transform;
}
.as-logo-row-reverse{
  animation-direction:reverse;
  animation-duration:32s;
}
.as-logo-set{
  display:flex;
  align-items:center;
  gap:34px;
  padding-right:34px;
  flex:0 0 auto;
}
.as-logo-set img{
  width:auto !important;
  height:auto !important;
  max-width:84px !important;
  max-height:29px !important;
  object-fit:contain;
  display:block;
  flex:0 0 auto;
}
.as-logo-row:hover{
  animation-play-state:paused;
}
@keyframes asLogoMove{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}
@media(max-width:1300px){
  .as-logo-marquee{ width:100% !important; }
}
@media(max-width:768px){
  .as-logo-marquee{
    width:100% !important;
    max-width:100% !important;
    height:170px !important;
    min-height:170px !important;
    margin:0 auto !important;
    background:#fff !important;
    overflow:hidden !important;
    display:flex !important;
    align-items:center !important;
  }
  .as-logo-track{ gap:22px; }
  .as-logo-row{ animation-duration:20s; }
  .as-logo-row-reverse{ animation-duration:24s; }
  .as-logo-set{ gap:24px; padding-right:24px; }
  .as-logo-set img{ max-width:74px !important; max-height:25px !important; }
}
</style>

        <img width="84" height="29" src="https://banamailing.com/andes-safety/wp-content/uploads/2024/08/Logo_Honeywell.png" alt="Honeywell">
        <img width="84" height="29" src="https://banamailing.com/andes-safety/wp-content/uploads/2024/08/Logo-COAST.png" alt="COAST">
